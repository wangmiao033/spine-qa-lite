<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spine 动画验收台</title>
<link id="spineCss" rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/spine-player.min.css">
<script id="spineJs" data-version="4.2" src="https://unpkg.com/@esotericsoftware/spine-player@4.2.*/dist/iife/spine-player.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#2b3440;--text:#e7edf5;--muted:#8e9aaa;--blue:#2f73e8;--green:#43d49f;--red:#ff6b78}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}header{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#11171e}.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2877ff,#6b52ff);display:grid;place-items:center;font-weight:800}.title{font-weight:800}.sub{font-size:12px;color:var(--muted)}.top{margin-left:auto;display:flex;gap:8px}.pill{font-size:12px;color:#aeb9c8;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#0e141b}main{min-height:0;display:grid;grid-template-columns:310px 1fr}aside{min-height:0;overflow:auto;padding:14px;border-right:1px solid var(--line);background:#11171e}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;margin-bottom:12px}.card h3{font-size:13px;margin:0 0 10px}.drop{border:1px dashed #536170;border-radius:9px;min-height:112px;display:grid;place-items:center;text-align:center;padding:12px;cursor:pointer;background:#10161d}.drop.drag{border-color:#4d8dff;background:#12243b}.drop small{display:block;margin-top:5px;color:var(--muted);line-height:1.5}#fileInput,#refInput{display:none}.status{display:grid;gap:6px;margin-top:9px;font-size:12px}.status div{display:flex;justify-content:space-between;gap:10px}.ok{color:var(--green)}.bad{color:var(--red)}.muted{color:var(--muted)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:#1b2531;color:var(--text);border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px}.btn:hover{border-color:#4f6680}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.active{outline:2px solid rgba(76,141,255,.35);border-color:#4c8dff}.wide{width:100%}select{width:100%;background:#0e151d;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px}.animList{max-height:160px;overflow:auto;display:grid;gap:4px}.anim{border:0;background:transparent;color:#b9c4d2;text-align:left;border-radius:6px;padding:7px 8px;cursor:pointer}.anim:hover{background:#1b2735}.anim.active{background:#286fe8;color:#fff}.range{display:grid;grid-template-columns:46px 1fr 42px;align-items:center;gap:8px;margin-top:9px;color:var(--muted);font-size:12px}input[type=range]{width:100%;accent-color:#4c8dff}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.swatch{height:30px;border:1px solid var(--line);border-radius:6px;cursor:pointer}.check{background-color:#fff;background-image:linear-gradient(45deg,#d5d5d5 25%,transparent 25%),linear-gradient(-45deg,#d5d5d5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d5d5d5 75%),linear-gradient(-45deg,transparent 75%,#d5d5d5 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}.dark{background:#171717}.white{background:#fff}.game{background:linear-gradient(145deg,#07141d,#0d3344 55%,#050b10)}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:1fr 56px}.stageWrap{min-height:0;padding:16px}.stage{position:relative;width:100%;height:100%;min-height:380px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#171717}.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#d5d5d5 25%,transparent 25%),linear-gradient(-45deg,#d5d5d5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d5d5d5 75%),linear-gradient(-45deg,transparent 75%,#d5d5d5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.stage.whitebg{background:#fff}.stage.gamebg{background:radial-gradient(circle at 50% 35%,rgba(45,202,235,.18),transparent 30%),linear-gradient(145deg,#07141d,#0c2e3e 55%,#050b10)}#player{position:absolute;inset:0}#player .spine-player{width:100%!important;height:100%!important;background:transparent!important}#player canvas{transform-origin:50% 50%;will-change:transform;cursor:grab}.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);text-align:center}.empty strong{display:block;color:#d2dbe6;font-size:20px;margin-bottom:7px}.badge{position:absolute;z-index:5;top:12px;left:12px;padding:7px 10px;border-radius:7px;background:rgba(8,14,20,.86);border:1px solid rgba(255,255,255,.08);font-size:12px;color:#aeb9c8}.badge.good{color:#96ecc6}.badge.err{color:#ff9da7}.ref{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;pointer-events:none}.ref.show{display:flex}.ref img{max-width:94%;max-height:94%;object-fit:contain}.bottom{border-top:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:7px;background:#11171e}.spacer{flex:1}.metric{font-size:12px;color:var(--muted);padding:5px 8px;border-right:1px solid var(--line)}.metric b{color:#dce4ed}.toast{position:fixed;right:18px;bottom:72px;background:#19232e;border:1px solid #354456;border-radius:8px;padding:10px 13px;font-size:12px;opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">S</div><div><div class="title">Spine 动画验收台</div><div class="sub">精简版 · 本地文件不上传服务器</div></div><div class="top"><span class="pill" id="runtimeBadge">Runtime 4.2</span><span class="pill">换皮验收</span></div></header>
<main>
<aside>
<section class="card"><h3>① 文件导入</h3><label class="drop" id="drop"><input id="fileInput" type="file" multiple accept=".json,.skel,.atlas,.txt,.png,.jpg,.jpeg,.webp"><div><b>拖入一整套 Spine 文件</b><small>.json / .skel + .atlas + .png<br>或点击这里选择</small></div></label><div class="status"><div><span>骨骼文件</span><span id="stSkeleton" class="bad">× 未导入</span></div><div><span>Atlas</span><span id="stAtlas" class="bad">× 未导入</span></div><div><span>纹理</span><span id="stTexture" class="muted">0 个</span></div></div><div class="row" style="margin-top:9px"><button class="btn primary" id="loadBtn">应用并预览</button><button class="btn" id="clearBtn">清空</button></div></section>
<section class="card"><h3>② Runtime</h3><select id="runtime"><option value="4.2">Spine 4.2（推荐）</option><option value="4.1">Spine 4.1</option><option value="4.0">Spine 4.0</option><option value="3.8">Spine 3.8</option></select><div class="sub" style="margin-top:7px">版本需与导出版本一致。</div></section>
<section class="card"><h3>③ 动画列表</h3><div class="animList" id="animList"><div class="muted" style="font-size:12px">导入后自动识别</div></div></section>
<section class="card"><h3>④ 播放 / 缩放</h3><div class="row"><button class="btn primary" id="playBtn">▶ 播放</button><button class="btn" data-speed=".5">0.5×</button><button class="btn active" data-speed="1">1×</button><button class="btn" data-speed="1.5">1.5×</button><button class="btn" data-speed="2">2×</button></div><div class="range"><span>缩放</span><input id="zoom" type="range" min="70" max="350" value="135"><span id="zoomText">135%</span></div><div class="row" style="margin-top:8px"><button class="btn" data-zoom="100">100%</button><button class="btn" data-zoom="150">150%</button><button class="btn" data-zoom="200">200%</button><button class="btn" data-zoom="300">300%</button><button class="btn" id="fitBtn">适配</button><button class="btn" id="centerBtn">居中</button></div></section>
<section class="card"><h3>⑤ 背景</h3><div class="swatches"><button class="swatch check" data-bg="checker" title="透明棋盘"></button><button class="swatch dark" data-bg="dark" title="深灰"></button><button class="swatch white" data-bg="white" title="白色"></button><button class="swatch game" data-bg="game" title="创建页模拟"></button></div></section>
<section class="card"><h3>⑥ 对比 / 调试</h3><input id="refInput" type="file" accept="image/png,image/jpeg,image/webp"><div class="row"><button class="btn" id="refPickBtn">选择原静态图</button><button class="btn" id="refShowBtn">原图</button><button class="btn" id="frame0Btn">第 0 帧</button><button class="btn" id="debugBtn">骨骼 Debug</button></div></section>
<button class="btn wide" id="copyReport">复制验收报告</button>
</aside>
<section class="workspace"><div class="stageWrap"><div class="stage gamebg" id="stage"><div id="player"></div><div class="ref" id="refOverlay"><img id="refImg"></div><div class="empty" id="empty"><div><strong>把角色直接拖进来</strong>一整套文件同时导入即可<br>加载后默认放大显示</div></div><div class="badge" id="badge">等待文件</div></div></div><div class="bottom"><button class="btn" id="prevFrame">◀ 1 帧</button><button class="btn" id="nextFrame">1 帧 ▶</button><div class="spacer"></div><div class="metric">动画 <b id="mAnim">-</b></div><div class="metric">时长 <b id="mDuration">-</b></div><div class="metric">Bones <b id="mBones">-</b></div><div class="metric">Slots <b id="mSlots">-</b></div><div class="metric">Loop <b id="mLoop">-</b></div></div></section>
</main>
</div><div class="toast" id="toast"></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let files=[],player=null,currentAnimation="",debug=false,pan={x:0,y:0},zoom=1.35,dragging=false,dragStart=null,refUrl="";const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1700)};function classify(){const skeleton=files.find(f=>/\.json$/i.test(f.name))||files.find(f=>/\.skel$/i.test(f.name)),atlas=files.find(f=>/\.atlas(\.txt)?$/i.test(f.name)),tex=files.filter(f=>/\.(png|jpe?g|webp)$/i.test(f.name));$("#stSkeleton").textContent=skeleton?"✓ "+skeleton.name:"× 未导入";$("#stSkeleton").className=skeleton?"ok":"bad";$("#stAtlas").textContent=atlas?"✓ "+atlas.name:"× 未导入";$("#stAtlas").className=atlas?"ok":"bad";$("#stTexture").textContent=tex.length+" 个";$("#stTexture").className=tex.length?"ok":"muted";return{skeleton,atlas,tex}}function setFiles(list){const m=new Map(files.map(f=>[f.name,f]));for(const f of list)m.set(f.name,f);files=[...m.values()];classify()}const drop=$("#drop");["dragenter","dragover"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>setFiles(e.dataTransfer.files));$("#fileInput").addEventListener("change",e=>setFiles(e.target.files));$("#stage").addEventListener("dragover",e=>e.preventDefault());$("#stage").addEventListener("drop",e=>{e.preventDefault();setFiles(e.dataTransfer.files);loadCurrent()});const dataUri=f=>new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});async function ensureRuntime(v){const old=$("#spineJs"),cur=old?.dataset.version||"4.2";if(cur===v&&window.spine)return;if(player){try{player.dispose()}catch(e){}player=null}window.spine=undefined;$("#spineJs")?.remove();$("#spineCss")?.remove();const l=document.createElement("link");l.id="spineCss";l.rel="stylesheet";l.href=`https://unpkg.com/@esotericsoftware/spine-player@${v}.*/dist/spine-player.min.css`;document.head.appendChild(l);await new Promise((r,j)=>{const s=document.createElement("script");s.id="spineJs";s.dataset.version=v;s.src=`https://unpkg.com/@esotericsoftware/spine-player@${v}.*/dist/iife/spine-player.min.js`;s.onload=r;s.onerror=j;document.head.appendChild(s)});$("#runtimeBadge").textContent="Runtime "+v}function applyTransform(){const c=$("#player canvas");if(!c)return;c.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;$("#zoom").value=Math.round(zoom*100);$("#zoomText").textContent=Math.round(zoom*100)+"%"}function renderAnims(){const list=$("#animList");list.innerHTML="";const a=player?.skeleton?.data?.animations||[];if(!a.length){list.innerHTML='<div class="muted" style="font-size:12px">未识别到动画</div>';return}a.forEach(x=>{const b=document.createElement("button");b.className="anim"+(x.name===currentAnimation?" active":"");b.textContent=x.name;b.onclick=()=>playAnim(x.name);list.appendChild(b)})}function metrics(){const d=player?.skeleton?.data,a=(d?.animations||[]).find(x=>x.name===currentAnimation);$("#mAnim").textContent=currentAnimation||"-";$("#mDuration").textContent=a?(a.duration||0).toFixed(2)+"s":"-";$("#mBones").textContent=d?.bones?.length??"-";$("#mSlots").textContent=d?.slots?.length??"-";$("#mLoop").textContent=player?"ON":"-"}function playAnim(n){if(!player)return;currentAnimation=n;try{player.setAnimation(n,true);player.play()}catch(e){}$("#playBtn").textContent="⏸ 暂停";renderAnims();metrics()}async function loadCurrent(){const{skeleton,atlas,tex}=classify();if(!skeleton||!atlas||!tex.length){toast("需要骨骼 + atlas + 纹理文件");return}$("#badge").textContent="正在加载…";$("#badge").className="badge";$("#empty").style.display="none";try{await ensureRuntime($("#runtime").value);if(player){try{player.dispose()}catch(e){}}$("#player").innerHTML="";const raw={};raw[skeleton.name]=await dataUri(skeleton);raw[atlas.name]=await dataUri(atlas);for(const f of tex)raw[f.name]=await dataUri(f);let meta=null;if(/\.json$/i.test(skeleton.name)){try{meta=JSON.parse(await skeleton.text())}catch(e){}}const initial=meta?.animations&&(meta.animations.daiji?"daiji":meta.animations.idle?"idle":Object.keys(meta.animations)[0]);player=new spine.SpinePlayer("player",{skeleton:skeleton.name,atlas:atlas.name,rawDataURIs:raw,animation:initial,showControls:false,showLoading:false,premultipliedAlpha:true,alpha:true,backgroundColor:"#00000000",preserveDrawingBuffer:true,interactive:false,debug:debug?{bones:true,regions:false,meshes:true,bounds:true,paths:false,clipping:false,points:false,hulls:false}:undefined,success:p=>{player=p;const a=p.skeleton?.data?.animations||[];currentAnimation=initial||a[0]?.name||"";if(currentAnimation){try{p.setAnimation(currentAnimation,true);p.play()}catch(e){}}$("#playBtn").textContent="⏸ 暂停";$("#badge").textContent=`✓ 已加载 · ${a.length} 个动画`;$("#badge").className="badge good";renderAnims();metrics();pan={x:0,y:0};zoom=1.35;requestAnimationFrame(()=>requestAnimationFrame(applyTransform))},error:(p,m)=>{$("#badge").textContent="加载失败："+m;$("#badge").className="badge err";$("#empty").style.display="grid"}})}catch(e){$("#badge").textContent="加载失败："+(e.message||e);$("#badge").className="badge err";$("#empty").style.display="grid"}}$("#loadBtn").onclick=loadCurrent;$("#clearBtn").onclick=()=>{if(player){try{player.dispose()}catch(e){}}player=null;files=[];currentAnimation="";$("#player").innerHTML="";$("#empty").style.display="grid";$("#badge").textContent="等待文件";$("#badge").className="badge";$("#animList").innerHTML='<div class="muted" style="font-size:12px">导入后自动识别</div>';classify();metrics()};$("#runtime").onchange=()=>{if(files.length)loadCurrent()};$("#playBtn").onclick=()=>{if(!player)return;if(player.paused){player.play();$("#playBtn").textContent="⏸ 暂停"}else{player.pause();$("#playBtn").textContent="▶ 播放"}};$$('[data-speed]').forEach(b=>b.onclick=()=>{if(player)player.speed=Number(b.dataset.speed);$$('[data-speed]').forEach(x=>x.classList.toggle("active",x===b))});$("#zoom").oninput=e=>{zoom=Number(e.target.value)/100;applyTransform()};$$('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=Number(b.dataset.zoom)/100;applyTransform()});$("#fitBtn").onclick=()=>{zoom=1;pan={x:0,y:0};applyTransform()};$("#centerBtn").onclick=()=>{pan={x:0,y:0};applyTransform()};$$('[data-bg]').forEach(b=>b.onclick=()=>{const s=$("#stage");s.className="stage";if(b.dataset.bg==="checker")s.classList.add("checker");if(b.dataset.bg==="white")s.classList.add("whitebg");if(b.dataset.bg==="game")s.classList.add("gamebg")});$("#stage").addEventListener("wheel",e=>{if(!player)return;e.preventDefault();zoom=Math.max(.7,Math.min(3.5,zoom*(e.deltaY<0?1.08:.92)));applyTransform()},{passive:false});$("#stage").addEventListener("pointerdown",e=>{if(!player||e.button!==0)return;dragging=true;dragStart={x:e.clientX-pan.x,y:e.clientY-pan.y};$("#stage").setPointerCapture(e.pointerId)});$("#stage").addEventListener("pointermove",e=>{if(!dragging)return;pan={x:e.clientX-dragStart.x,y:e.clientY-dragStart.y};applyTransform()});$("#stage").addEventListener("pointerup",()=>dragging=false);function gotoTime(t){if(!player?.animationState)return;try{player.pause();const e=player.animationState.getCurrent(0);if(e){e.trackTime=Math.max(0,t);player.animationState.apply(player.skeleton);player.skeleton.updateWorldTransform(spine.Physics.update)}$("#playBtn").textContent="▶ 播放"}catch(e){}}$("#frame0Btn").onclick=()=>gotoTime(0);$("#prevFrame").onclick=()=>{const e=player?.animationState?.getCurrent?.(0);gotoTime(Math.max(0,(e?.trackTime||0)-1/30))};$("#nextFrame").onclick=()=>{const e=player?.animationState?.getCurrent?.(0);gotoTime((e?.trackTime||0)+1/30)};$("#debugBtn").onclick=()=>{debug=!debug;$("#debugBtn").classList.toggle("active",debug);if(files.length)loadCurrent()};$("#refPickBtn").onclick=()=>$("#refInput").click();$("#refInput").onchange=e=>{const f=e.target.files[0];if(!f)return;if(refUrl)URL.revokeObjectURL(refUrl);refUrl=URL.createObjectURL(f);$("#refImg").src=refUrl;toast("原静态图已载入")};$("#refShowBtn").onclick=()=>{if(!refUrl){toast("先选择原静态图");return}$("#refOverlay").classList.toggle("show");$("#refShowBtn").classList.toggle("active",$("#refOverlay").classList.contains("show"))};$("#copyReport").onclick=async()=>{const d=player?.skeleton?.data,a=(d?.animations||[]).find(x=>x.name===currentAnimation),r=["Spine 动画验收",`文件：${player?"加载正常":"未加载"}`,`动画：${currentAnimation||"-"}${a?` / ${(a.duration||0).toFixed(2)}s`:""}`,`Bones：${d?.bones?.length??"-"}`,`Slots：${d?.slots?.length??"-"}`,"Loop：ON",`Runtime：${$("#runtime").value}`,`Debug：${debug?"ON":"OFF"}`].join("\n");try{await navigator.clipboard.writeText(r);toast("验收报告已复制")}catch(e){toast("复制失败")}};classify()})();
</script>
</body></html>
